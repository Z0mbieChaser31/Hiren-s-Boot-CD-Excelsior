# =============================================================================
# Hiren's Boot CD — Excelsior
# GRUB2 Configuration — Supports UEFI (x64/ARM64) and Legacy BIOS
# =============================================================================

# Global settings
set default=0
set timeout=30
set timeout_style=menu

# Load required modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod ext2
insmod ntfs
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font

# =============================================================================
# Theme & Graphics
# =============================================================================
if loadfont /boot/grub/themes/excelsior/fonts/unicode.pf2 ; then
  set gfxmode=auto
  terminal_output gfxterm
  set theme=/boot/grub/themes/excelsior/theme.txt
fi

# =============================================================================
# Helper: detect if we're on UEFI or BIOS
# =============================================================================
if [ "${grub_platform}" = "efi" ]; then
  set _is_uefi=true
else
  set _is_uefi=false
fi

# =============================================================================
# Menu Entries
# =============================================================================

# -----------------------------------------------------------------------------
# 1. SystemRescue — Main rescue environment
# -----------------------------------------------------------------------------
menuentry "SystemRescue — Full Linux Rescue Environment" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
         setkmap=us nofirewall copytoram
  initrd /sysrescue/boot/x86_64/sysrescue.img
}

menuentry "SystemRescue — with Network (DHCP auto)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
         setkmap=us nofirewall copytoram dostartx=0
  initrd /sysrescue/boot/x86_64/sysrescue.img
}

menuentry "SystemRescue — Graphical Desktop (Xfce)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
         setkmap=us nofirewall copytoram dostartx=1
  initrd /sysrescue/boot/x86_64/sysrescue.img
}

# Separator
menuentry "──────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 2. Memtest86+ — Memory diagnostics
# -----------------------------------------------------------------------------
menuentry "Memtest86+ — Memory Diagnostics (UEFI native)" --class memtest {
  search --no-floppy --label --set=root EXCELSIOR
  if [ "${_is_uefi}" = "true" ]; then
    chainloader /boot/memtest86/memtest.efi
  else
    linux16 /boot/memtest86/memtest.bin
  fi
}

# -----------------------------------------------------------------------------
# 3. GParted Live — Graphical disk partitioner
# -----------------------------------------------------------------------------
menuentry "GParted Live — Graphical Disk Partitioning" --class gparted {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /gparted/live/vmlinuz boot=live config \
         components union=overlay username=user \
         noswap noeject vga=788 fetch=file:///lib/live/mount/medium/gparted/live/filesystem.squashfs
  initrd /gparted/live/initrd.img
}

# Separator
menuentry "──────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 4. Hardware Detection Tool (HDT) — BIOS-level hardware info
# -----------------------------------------------------------------------------
if [ "${_is_uefi}" = "false" ]; then
  menuentry "HDT — Hardware Detection Tool (Legacy BIOS)" --class hardware {
    search --no-floppy --label --set=root EXCELSIOR
    linux16 /boot/hdt/hdt.c32
  }
fi

# -----------------------------------------------------------------------------
# 5. Boot from first local disk
# -----------------------------------------------------------------------------
menuentry "──────────────────────────────────" {
  true
}

menuentry "Boot from First Local Disk (hd0)" --class os {
  insmod chain
  if [ "${_is_uefi}" = "true" ]; then
    # UEFI: try to chainload the first EFI boot entry
    search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
    if [ $? = 0 ]; then
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    else
      search --no-floppy --set=root --file /EFI/BOOT/BOOTX64.EFI
      chainloader /EFI/BOOT/BOOTX64.EFI
    fi
  else
    # Legacy BIOS: boot MBR of first disk
    set root=(hd0)
    chainloader +1
  fi
}

menuentry "Boot from Second Local Disk (hd1)" --class os {
  insmod chain
  if [ "${_is_uefi}" = "false" ]; then
    set root=(hd1)
    chainloader +1
  fi
}

# -----------------------------------------------------------------------------
# 6. Advanced / Troubleshooting
# -----------------------------------------------------------------------------
submenu "Advanced Options ▶" --class settings {
  menuentry "SystemRescue — Serial Console (115200 baud)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
           setkmap=us nofirewall console=ttyS0,115200n8 console=tty0
    initrd /sysrescue/boot/x86_64/sysrescue.img
  }

  menuentry "SystemRescue — Safe Mode (nomodeset)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
           setkmap=us nofirewall copytoram nomodeset
    initrd /sysrescue/boot/x86_64/sysrescue.img
  }

  menuentry "SystemRescue — RAM Copy (run fully from RAM)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysrescue/boot/x86_64/vmlinuz archisobasedir=sysrescue archisolabel=EXCELSIOR \
           setkmap=us nofirewall copytoram
    initrd /sysrescue/boot/x86_64/sysrescue.img
  }

  menuentry "Reboot System" --class reboot {
    reboot
  }

  menuentry "Power Off System" --class poweroff {
    halt
  }
}
