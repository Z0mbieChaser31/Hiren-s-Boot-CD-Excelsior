# =============================================================================
# Hiren's Boot CD — Excelsior 2.0
# Universal GRUB2 Configuration
# Supports: 64-bit UEFI, 64-bit BIOS, and 32-bit Legacy / Low-RAM Systems
# (Vortex86, Atom, Pentium, 512MB RAM, basic VGA controllers)
# =============================================================================

# Global settings
set default=0
set timeout=30
set timeout_style=menu
# TIP: Press 'c' at any time to open the GRUB2 command line shell.
# TIP: Press 'e' on any entry to edit its kernel parameters before booting.

# Load filesystem/partition modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod ext2
insmod ntfs

# CPU detection
insmod cpuid

# =============================================================================
# TERMINAL MODE — Safe text console first.
# Attempt gfxterm only if VESA/VBE is available.
# Vortex86MX and many legacy embedded boards have a plain VGA controller that
# cannot switch to a framebuffer mode.  Calling terminal_output gfxterm on
# those machines produces an instant black screen.  We try gfxterm and fall
# back to the plain text console if it fails.
# =============================================================================
insmod all_video
insmod gfxterm
insmod vbe

# Try a minimal safe resolution first; fall through to "auto" which may pick
# plain text mode on hardware that cannot do VBE.
if [ "${grub_platform}" = "efi" ]; then
  set gfxmode=1024x768,800x600,auto
else
  set gfxmode=800x600,640x480,auto
fi

# Try graphical terminal — if the hardware can't do it, fall back silently.
# The fallback keeps the boot menu readable on old VGA-only machines.
if terminal_output gfxterm; then
  # Load fonts only when gfxterm is actually running
  insmod font
  loadfont /boot/grub/themes/excelsior/fonts/dejavu-14.pf2 || true
  loadfont /boot/grub/themes/excelsior/fonts/dejavu-12.pf2 || true
  loadfont /boot/grub/themes/excelsior/fonts/dejavu-18.pf2 || true
  loadfont /boot/grub/themes/excelsior/fonts/dejavu-11.pf2 || true
  loadfont /boot/grub/themes/excelsior/fonts/unicode.pf2   || true
  loadfont /boot/grub/fonts/unicode.pf2                    || true

  insmod gfxmenu
  insmod png
  if [ -f /boot/grub/themes/excelsior/theme.txt ]; then
    set theme=/boot/grub/themes/excelsior/theme.txt
  fi
else
  # Plain VGA text mode — perfectly usable, just no graphics
  terminal_output console
fi

# =============================================================================
# CPU Architecture Detection
# =============================================================================
if cpuid -l; then
  set cpu_64bit=true
else
  set cpu_64bit=false
fi

# =============================================================================
# Menu Entries
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 32-bit Legacy Rescue — listed FIRST so it is the default on all hardware
#    including old 32-bit CPUs that cannot run the 64-bit kernel at all.
# -----------------------------------------------------------------------------
menuentry "SystemRescue 32-bit — Safe Mode (Vortex86 / Atom / 512MB RAM)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  # vga=normal   — disable VBE/framebuffer switching (critical for plain VGA chips)
  # nomodeset    — prevent kernel KMS driver from trying to reprogram the GPU
  # docache=no   — do NOT copy sysrcd.dat to RAM (would need >512MB free)
  # dodhcp=0     — skip DHCP probing to speed up boot on isolated systems
  # subdir       — tell sysresccd where sysrcd.dat lives on the ISO
  linux  /boot/sysrcd32/rescue32 vga=normal nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir=
  initrd /boot/sysrcd32/initram.igz
}

menuentry "SystemRescue 32-bit — Graphical Desktop (512MB RAM / requires modesetting)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  # dostartx launches Xfce. Remove vga=normal if you want the graphical framebuffer.
  linux  /boot/sysrcd32/rescue32 nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir= dostartx
  initrd /boot/sysrcd32/initram.igz
}

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 2. 64-bit Modern Rescue (SystemRescue 13.01 — 64-bit UEFI & BIOS — 2GB+ RAM)
#    Only displayed when a 64-bit capable CPU is detected.
# -----------------------------------------------------------------------------
if [ "${cpu_64bit}" = "true" ]; then
  menuentry "SystemRescue 64-bit — Full Rescue Environment (2GB+ RAM)" --class systemrescue --class gnu-linux {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
           iomem=relaxed setkmap=us nofirewall copytoram
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
  }

  menuentry "SystemRescue 64-bit — Graphical Desktop (Xfce / GParted)" --class systemrescue --class gnu-linux {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
           iomem=relaxed setkmap=us nofirewall copytoram dostartx=1
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
  }
fi

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 3. Terminal / Shell — works on ALL hardware (32-bit and 64-bit)
#    Drops straight to a root shell. No desktop. Type commands immediately.
#    You can also press 'c' anywhere in the GRUB menu to open a GRUB shell.
# -----------------------------------------------------------------------------
menuentry ">> Terminal / Shell — 32-bit (Vortex86 / Atom / any old PC)" --class terminal {
  search --no-floppy --label --set=root EXCELSIOR
  # nox = stay in text mode shell, vga=normal = no framebuffer switch
  linux  /boot/sysrcd32/rescue32 vga=normal nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir= nox
  initrd /boot/sysrcd32/initram.igz
}

if [ "${cpu_64bit}" = "true" ]; then
  menuentry ">> Terminal / Shell — 64-bit (modern hardware)" --class terminal {
    search --no-floppy --label --set=root EXCELSIOR
    # Boots to root shell — no desktop started
    linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
           iomem=relaxed setkmap=us nofirewall nomodeset
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
  }
fi

menuentry ">> GRUB2 Command Line (press 'c' anywhere for this)" --class terminal {
  # Drop into GRUB2 interactive shell.
  # Useful: ls (hd0,1)/   linux /vmlinuz root=/dev/sda1   boot
  terminal_output console
}

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 4. Memtest86+

# -----------------------------------------------------------------------------
menuentry "Memtest86+ — Memory Diagnostics" --class memtest {
  search --no-floppy --label --set=root EXCELSIOR
  linux /boot/memtest86/memtest.bin
}

# -----------------------------------------------------------------------------
# 4. Hardware Detection Tool (HDT — Legacy BIOS only)
# -----------------------------------------------------------------------------
if [ "${_is_uefi}" = "false" ]; then
  menuentry "HDT — Hardware Detection Tool (Legacy BIOS)" --class hardware {
    search --no-floppy --label --set=root EXCELSIOR
    linux16 /boot/isolinux/hdt.c32
  }
fi

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 5. Boot from Local Hard Disk
# -----------------------------------------------------------------------------
menuentry "Boot from First Local Disk (hd0)" --class os {
  insmod chain
  if [ "${grub_platform}" = "efi" ]; then
    search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
    if [ $? = 0 ]; then
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    else
      search --no-floppy --set=root --file /EFI/BOOT/BOOTX64.EFI
      chainloader /EFI/BOOT/BOOTX64.EFI
    fi
  else
    set root=(hd0)
    chainloader +1
  fi
}

menuentry "Boot from Second Local Disk (hd1)" --class os {
  insmod chain
  set root=(hd1)
  chainloader +1
}

# -----------------------------------------------------------------------------
# 6. Advanced / Troubleshooting
# -----------------------------------------------------------------------------
submenu "Advanced & Safe Mode Options ▶" --class settings {

  menuentry "32-bit — Force Text Console Only (safest for VGA-only hardware)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    # terminal_input + output set to console inside GRUB before handing off
    terminal_output console
    linux  /boot/sysrcd32/rescue32 vga=normal nomodeset noeject nofirewall scandelay=2 setkmap=us docache=no dodhcp=0 subdir=
    initrd /boot/sysrcd32/initram.igz
  }

  menuentry "32-bit — Verbose Boot (debug messages visible)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /boot/sysrcd32/rescue32 vga=normal nomodeset noeject nofirewall scandelay=2 setkmap=us docache=no dodhcp=0 subdir= debug
    initrd /boot/sysrcd32/initram.igz
  }

  menuentry "32-bit — No RAID/LVM (read-only safe)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /boot/sysrcd32/rescue32 vga=normal nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir= nomdlvm
    initrd /boot/sysrcd32/initram.igz
  }

  if [ "${cpu_64bit}" = "true" ]; then
    menuentry "64-bit — Safe Mode (nomodeset)" --class systemrescue {
      search --no-floppy --label --set=root EXCELSIOR
      linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
             iomem=relaxed setkmap=us nofirewall nomodeset
      initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
    }
  fi

  menuentry "Switch to Standard Text Console" --class terminal {
    terminal_output console
  }

  menuentry "Reboot System" --class reboot {
    reboot
  }

  menuentry "Power Off System" --class poweroff {
    halt
  }
}
