# =============================================================================
# Hiren's Boot CD — Excelsior 2.0
# Universal GRUB2 Configuration — Supports 64-bit UEFI, 64-bit BIOS, and
# 32-bit Legacy / Low-RAM Systems (Vortex86, Atom, Pentium, 512MB RAM)
# =============================================================================

# Global settings
set default=0
set timeout=30
set timeout_style=menu

# Load required modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod udf
insmod ext2
insmod ntfs
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod font
insmod cpuid

# =============================================================================
# Theme & Graphics (with multiple font fallbacks)
# =============================================================================
loadfont /boot/grub/themes/excelsior/fonts/dejavu-14.pf2
loadfont /boot/grub/themes/excelsior/fonts/dejavu-12.pf2
loadfont /boot/grub/themes/excelsior/fonts/dejavu-18.pf2
loadfont /boot/grub/themes/excelsior/fonts/dejavu-11.pf2
loadfont /boot/grub/themes/excelsior/fonts/unicode.pf2
loadfont /boot/grub/fonts/unicode.pf2

if [ "${grub_platform}" = "efi" ]; then
  set _is_uefi=true
  set gfxmode=1024x768,800x600,auto
else
  set _is_uefi=false
  set gfxmode=1024x768,800x600,640x480,auto
fi

terminal_output gfxterm
if [ -f /boot/grub/themes/excelsior/theme.txt ]; then
  set theme=/boot/grub/themes/excelsior/theme.txt
fi

# =============================================================================
# CPU Architecture Detection
# =============================================================================
if cpuid -l ; then
  set cpu_64bit=true
else
  set cpu_64bit=false
fi

# =============================================================================
# Menu Entries
# =============================================================================

# -----------------------------------------------------------------------------
# 1. 64-bit Modern Rescue (SystemRescue 13.01 — UEFI & 64-bit BIOS — 2GB+ RAM)
# -----------------------------------------------------------------------------
if [ "${cpu_64bit}" = "true" ]; then
  menuentry "SystemRescue 64-bit — Full Rescue Environment (2GB+ RAM)" --class systemrescue --class gnu-linux {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
           iomem=relaxed setkmap=us nofirewall copytoram
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
  }

  menuentry "SystemRescue 64-bit — Graphical Desktop (Xfce / GParted)" --class systemrescue --class gnu-linux {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
           iomem=relaxed setkmap=us nofirewall copytoram dostartx=1
    initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
  }
fi

# -----------------------------------------------------------------------------
# 2. 32-bit Legacy Rescue (SystemRescue 5.3.2 — Vortex86, Atom, 512MB RAM Safe)
# -----------------------------------------------------------------------------
menuentry "SystemRescue 32-bit Legacy — Safe / Low-RAM Mode (512MB RAM — Vortex86/Atom/Pentium)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /boot/sysrcd32/rescue32 scandelay=1 setkmap=us nomodeset
  initrd /boot/sysrcd32/initram.igz
}

menuentry "SystemRescue 32-bit Legacy — Graphical Desktop (512MB RAM Safe)" --class systemrescue --class gnu-linux {
  search --no-floppy --label --set=root EXCELSIOR
  linux  /boot/sysrcd32/rescue32 scandelay=1 setkmap=us dostartx
  initrd /boot/sysrcd32/initram.igz
}

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 3. Memtest86+ — Memory diagnostics (supports 32-bit & 64-bit, UEFI & BIOS)
# -----------------------------------------------------------------------------
menuentry "Memtest86+ — Memory Diagnostics (Universal UEFI & BIOS)" --class memtest {
  search --no-floppy --label --set=root EXCELSIOR
  linux /sysresccd/boot/memtest
}

# -----------------------------------------------------------------------------
# 4. Hardware Detection Tool (HDT — Legacy BIOS)
# -----------------------------------------------------------------------------
if [ "${_is_uefi}" = "false" ]; then
  menuentry "HDT — Hardware Detection Tool (Legacy BIOS)" --class hardware {
    search --no-floppy --label --set=root EXCELSIOR
    linux16 /boot/isolinux/hdt.c32
  }
fi

# Separator
menuentry "──────────────────────────────────────────────────────" {
  true
}

# -----------------------------------------------------------------------------
# 5. Boot from Local Hard Disk
# -----------------------------------------------------------------------------
menuentry "Boot from First Local Disk (hd0)" --class os {
  insmod chain
  if [ "${_is_uefi}" = "true" ]; then
    search --no-floppy --set=root --file /EFI/Microsoft/Boot/bootmgfw.efi
    if [ $? = 0 ]; then
      chainloader /EFI/Microsoft/Boot/bootmgfw.efi
    else
      search --no-floppy --set=root --file /EFI/BOOT/BOOTX64.EFI
      chainloader /EFI/BOOT/BOOTX64.EFI
    fi
  else
    set root=(hd0)
    chainloader +1
  fi
}

menuentry "Boot from Second Local Disk (hd1)" --class os {
  insmod chain
  if [ "${_is_uefi}" = "false" ]; then
    set root=(hd1)
    chainloader +1
  fi
}

# -----------------------------------------------------------------------------
# 6. Advanced / Troubleshooting Options
# -----------------------------------------------------------------------------
submenu "Advanced & Safe Mode Options ▶" --class settings {
  menuentry "SystemRescue 32-bit — Direct Hardware Boot (no nomodeset)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /boot/sysrcd32/rescue32 scandelay=1 setkmap=us
    initrd /boot/sysrcd32/initram.igz
  }

  menuentry "SystemRescue 32-bit — Do not activate RAID/LVM (read-only safe)" --class systemrescue {
    search --no-floppy --label --set=root EXCELSIOR
    linux  /boot/sysrcd32/rescue32 scandelay=1 setkmap=us nomdlvm
    initrd /boot/sysrcd32/initram.igz
  }

  if [ "${cpu_64bit}" = "true" ]; then
    menuentry "SystemRescue 64-bit — Safe Mode (nomodeset)" --class systemrescue {
      search --no-floppy --label --set=root EXCELSIOR
      linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
             iomem=relaxed setkmap=us nofirewall nomodeset
      initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
    }

    menuentry "SystemRescue 64-bit — Serial Console (115200 baud)" --class systemrescue {
      search --no-floppy --label --set=root EXCELSIOR
      linux  /sysresccd/boot/x86_64/vmlinuz archisobasedir=sysresccd archisolabel=EXCELSIOR \
             iomem=relaxed setkmap=us nofirewall console=ttyS0,115200n8 console=tty0
      initrd /sysresccd/boot/intel_ucode.img /sysresccd/boot/amd_ucode.img /sysresccd/boot/x86_64/sysresccd.img
    }
  fi

  menuentry "Switch to Standard Text Console" --class terminal {
    terminal_output console
  }

  menuentry "Reboot System" --class reboot {
    reboot
  }

  menuentry "Power Off System" --class poweroff {
    halt
  }
}

