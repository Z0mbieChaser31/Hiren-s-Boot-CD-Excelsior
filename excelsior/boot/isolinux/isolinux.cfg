# =============================================================================
# Hiren's Boot CD — Excelsior
# ISOLINUX Configuration — Legacy BIOS Fallback
# =============================================================================
# This config is used when booting from a BIOS-mode CD/DVD.
# For USB boots and UEFI, GRUB2 is used instead (see /boot/grub/grub.cfg)
# =============================================================================

UI vesamenu.c32

# Visual
MENU TITLE  Hiren's Boot CD Excelsior — Legacy BIOS Boot
MENU COLOR  title      1;36;40  #9b7cdb  #00000000 std
MENU COLOR  border     30;44    #40606080 #00000000 std
MENU COLOR  sel        7;37;40  #ffffff  #6a5acd   std
MENU COLOR  unsel      37;44    #c8d0e8  #00000000 std
MENU COLOR  timeout    1;35;40  #a070ff  #00000000 std
MENU COLOR  timeout_msg 37;40  #c8d0e8  #00000000 std
MENU COLOR  help       37;40    #c8d0e8  #00000000 std
MENU COLOR  scrollbar  30;44    #40606080 #00000000 std

MENU ROWS    16
MENU TABMSGROW 18
MENU CMDLINEROW 18
MENU ENDROW  22
MENU HELPMSGROW 20

TIMEOUT 300
TOTALTIMEOUT 9000

DEFAULT excelsior-default

# =============================================================================
# Menu Entries
# =============================================================================

LABEL excelsior-default
  MENU LABEL ^SystemRescue — Full Rescue Environment (Default)
  KERNEL /sysrescue/boot/x86_64/vmlinuz
  APPEND initrd=/sysrescue/boot/x86_64/sysrescue.img archisobasedir=sysrescue archisolabel=EXCELSIOR setkmap=us nofirewall copytoram

LABEL sysrescue-net
  MENU LABEL SystemRescue — with Network (DHCP auto)
  KERNEL /sysrescue/boot/x86_64/vmlinuz
  APPEND initrd=/sysrescue/boot/x86_64/sysrescue.img archisobasedir=sysrescue archisolabel=EXCELSIOR setkmap=us nofirewall dostartx=0

LABEL sysrescue-gui
  MENU LABEL SystemRescue — Graphical Desktop (Xfce)
  KERNEL /sysrescue/boot/x86_64/vmlinuz
  APPEND initrd=/sysrescue/boot/x86_64/sysrescue.img archisobasedir=sysrescue archisolabel=EXCELSIOR setkmap=us nofirewall dostartx=1

LABEL separator1
  MENU LABEL ────────────────────────────────────
  MENU DISABLE

LABEL gparted
  MENU LABEL ^GParted Live — Graphical Disk Partitioning
  KERNEL /gparted/live/vmlinuz
  APPEND initrd=/gparted/live/initrd.img boot=live config components union=overlay username=user noswap noeject vga=788

LABEL memtest
  MENU LABEL ^Memtest86+ — Memory Diagnostics
  KERNEL /boot/memtest86/memtest.bin

LABEL hdt
  MENU LABEL ^HDT — Hardware Detection Tool
  COM32 /boot/hdt/hdt.c32

LABEL separator2
  MENU LABEL ────────────────────────────────────
  MENU DISABLE

LABEL localboot
  MENU LABEL Boot from First ^Local Disk
  LOCALBOOT 0x80

LABEL separator3
  MENU LABEL ────────────────────────────────────
  MENU DISABLE

LABEL sysrescue-safe
  MENU LABEL SystemRescue — Safe Mode (nomodeset)
  KERNEL /sysrescue/boot/x86_64/vmlinuz
  APPEND initrd=/sysrescue/boot/x86_64/sysrescue.img archisobasedir=sysrescue archisolabel=EXCELSIOR setkmap=us nofirewall copytoram nomodeset

LABEL sysrescue-serial
  MENU LABEL SystemRescue — Serial Console (ttyS0 115200)
  KERNEL /sysrescue/boot/x86_64/vmlinuz
  APPEND initrd=/sysrescue/boot/x86_64/sysrescue.img archisobasedir=sysrescue archisolabel=EXCELSIOR setkmap=us console=ttyS0,115200n8 console=tty0
