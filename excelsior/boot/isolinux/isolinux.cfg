# =============================================================================
# Hiren's Boot CD — Excelsior 2.0
# ISOLINUX Configuration — Legacy BIOS Boot Menu
# =============================================================================

UI vesamenu.c32

# Visual styling
MENU TITLE  Hiren's Boot CD Excelsior -- BIOS Boot Menu
MENU COLOR  title      1;36;40  #9b7cdb  #00000000 std
MENU COLOR  border     30;44    #40606080 #00000000 std
MENU COLOR  sel        7;37;40  #ffffff  #6a5acd   std
MENU COLOR  unsel      37;44    #c8d0e8  #00000000 std
MENU COLOR  timeout    1;35;40  #a070ff  #00000000 std
MENU COLOR  timeout_msg 37;40  #c8d0e8  #00000000 std
MENU COLOR  help       37;40    #c8d0e8  #00000000 std
MENU COLOR  scrollbar  30;44    #40606080 #00000000 std

MENU ROWS    16
MENU TABMSGROW 18
MENU CMDLINEROW 18
MENU ENDROW  22
MENU HELPMSGROW 20

TIMEOUT 300
TOTALTIMEOUT 9000

# Default to 32-bit safe mode — always works on Vortex86/Atom/old hardware
DEFAULT sysrescue32

# =============================================================================
# Menu Entries
# =============================================================================

LABEL sysrescue32
  MENU LABEL ^1) SystemRescue 32-bit -- Safe Mode (Vortex86 / Atom / 512MB RAM)
  KERNEL /boot/sysrcd32/rescue32
  # vga=normal   = disable VBE/framebuffer (essential for plain VGA chips like Vortex86MX)
  # nomodeset    = stop kernel KMS from re-initializing the video card
  # docache=no   = stream sysrcd.dat from disk -- do not copy to RAM (saves 400MB+)
  # subdir=      = tell initrd where to find sysrcd.dat (root of ISO)
  APPEND initrd=/boot/sysrcd32/initram.igz vga=normal nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir=
  TEXT HELP
  32-bit rescue. Works on Vortex86, Atom, Pentium and any 512MB RAM system.
  No framebuffer switching -- plain VGA text console.
  ENDTEXT

LABEL sysrescue32-gui
  MENU LABEL   SystemRescue 32-bit -- Graphical Desktop (512MB RAM / needs VGA modesetting)
  KERNEL /boot/sysrcd32/rescue32
  APPEND initrd=/boot/sysrcd32/initram.igz nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir= dostartx

LABEL terminal32
  MENU LABEL ^T) Terminal / Shell -- 32-bit (Vortex86 / Atom / any old PC)
  KERNEL /boot/sysrcd32/rescue32
  # nox = no X11, boots straight to root shell. vga=normal = no framebuffer.
  APPEND initrd=/boot/sysrcd32/initram.igz vga=normal nomodeset noeject nofirewall scandelay=1 setkmap=us docache=no dodhcp=0 subdir= nox
  TEXT HELP
  Drop straight to a root shell (text console). No desktop, no graphical
  interface. Works on ANY hardware including VGA-only systems.
  ENDTEXT

LABEL separator1

  MENU LABEL --------------------------------------------------------
  MENU DISABLE

LABEL sysrescue64
  MENU LABEL ^2) SystemRescue 64-bit -- Full Rescue (2GB+ RAM)
  KERNEL /sysresccd/boot/x86_64/vmlinuz
  APPEND initrd=/sysresccd/boot/intel_ucode.img,/sysresccd/boot/amd_ucode.img,/sysresccd/boot/x86_64/sysresccd.img archisobasedir=sysresccd archisolabel=EXCELSIOR iomem=relaxed setkmap=us nofirewall copytoram

LABEL sysrescue64-gui
  MENU LABEL   SystemRescue 64-bit -- Graphical Desktop (Xfce / GParted)
  KERNEL /sysresccd/boot/x86_64/vmlinuz
  APPEND initrd=/sysresccd/boot/intel_ucode.img,/sysresccd/boot/amd_ucode.img,/sysresccd/boot/x86_64/sysresccd.img archisobasedir=sysresccd archisolabel=EXCELSIOR iomem=relaxed setkmap=us nofirewall copytoram dostartx=1

LABEL terminal64
  MENU LABEL   Terminal / Shell -- 64-bit (modern hardware, text console)
  KERNEL /sysresccd/boot/x86_64/vmlinuz
  APPEND initrd=/sysresccd/boot/intel_ucode.img,/sysresccd/boot/amd_ucode.img,/sysresccd/boot/x86_64/sysresccd.img archisobasedir=sysresccd archisolabel=EXCELSIOR iomem=relaxed setkmap=us nofirewall nomodeset
  TEXT HELP
  64-bit root shell -- no graphical desktop. Type tools directly.
  ENDTEXT

LABEL separator2
  MENU LABEL --------------------------------------------------------
  MENU DISABLE

LABEL memtest
  MENU LABEL ^3) Memtest86+ -- Memory Diagnostics
  KERNEL /boot/memtest86/memtest.bin

LABEL hdt
  MENU LABEL ^4) HDT -- Hardware Detection Tool
  COM32 /boot/isolinux/hdt.c32

LABEL separator3
  MENU LABEL --------------------------------------------------------
  MENU DISABLE

LABEL localboot
  MENU LABEL Boot from First ^Local Disk
  LOCALBOOT 0x80
